name: 🌙 Nightly Unstop Scraper & Lead Distributor (11:00 PM IST)

on:
  # Automated schedule: Every night at 11:00 PM IST (17:30 UTC)
  schedule:
    - cron: "30 17 * * *"

  # Manual on-demand execution
  workflow_dispatch:
    inputs:
      unstop_token:
        description: "Fresh Unstop Bearer Token (optional; defaults to secret UNSTOP_TOKEN)"
        required: false
        type: string
      dry_run:
        description: "Dry Run: Scrape and evaluate candidates without committing or updating sheet"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  scrape-and-distribute:
    name: Scrape Unstop & Assign Leads
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Environment & Secrets
        id: resolve_env
        env:
          INPUT_TOKEN: ${{ inputs.unstop_token }}
          SECRET_TOKEN: ${{ secrets.UNSTOP_TOKEN }}
          VAR_TOKEN: ${{ vars.UNSTOP_TOKEN }}
        run: |
          # Priority: inputs > secrets > vars
          FINAL_TOKEN="${INPUT_TOKEN:-${SECRET_TOKEN:-$VAR_TOKEN}}"
          if [ -n "$FINAL_TOKEN" ]; then
            echo "::add-mask::$FINAL_TOKEN"
          fi
          echo "token=$FINAL_TOKEN" >> $GITHUB_OUTPUT

      - name: Run Nightly Scraper & Lead Distributor
        id: pipeline
        env:
          UNSTOP_TOKEN: ${{ steps.resolve_env.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_API_URL: ${{ secrets.GOOGLE_SHEET_API_URL || 'https://script.google.com/macros/s/AKfycbwQ8Jg5jKJNHho5QqnbLRI1R3n87ZLYaC7gUkgJJ0gRukbb2FrmOszChsIpANuEigV2Dw/exec' }}
        run: |
          python scripts/nightly_pipeline.py \
            --token "$UNSTOP_TOKEN" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit and Push Updated Leads & Ledger
        if: success() && !inputs.dry_run
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html pushed_phones.txt

          if git diff --staged --quiet; then
            echo "✓ No new leads to commit. Working tree clean."
          else
            NEW_COUNT="${{ steps.pipeline.outputs.new_leads_count || 'new' }}"
            git commit -m "chore(auto): 🌙 nightly unstop sync & assign ${NEW_COUNT} leads across callers [skip ci]"
            git push origin master
            echo "✓ Successfully committed and pushed updated calling database to master branch."
          fi
